name: website

on:
  push:
    paths:
      - 'website/**'
      - 'src/tint/**'
      - 'skills/tint-review/**'
      - 'scripts/export_mcp_examples.py'
      - 'tests/test_mcp.py'
      - 'docs/MCP.md'
      - 'pyproject.toml'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'src/tint/**'
      - 'skills/tint-review/**'
      - 'scripts/export_mcp_examples.py'
      - 'tests/test_mcp.py'
      - 'docs/MCP.md'
      - 'pyproject.toml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional integration and test runner
        run: python -m pip install -e ".[mcp]" pytest==9.0.3
      - name: Test analysis and real MCP transport
        run: python -m pytest tests/test_mcp.py
      - name: Check generated observations and portable guide
        run: python scripts/export_mcp_examples.py --check
      - name: Test website and build
        working-directory: website
        run: npm test
      - name: Upload static website
        uses: actions/upload-artifact@v4
        with:
          name: tint-website
          path: website/dist
          include-hidden-files: true
      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
