[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tint-guardrails"
version = "0.1.0"
description = "Executable conditioned-trust contracts for a local guardrail research testbed"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.5", "scipy==1.16.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
cache_dir = "archive/local/.pytest_cache"

[tool.coverage.run]
data_file = "archive/local/.coverage"
source = ["tint"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
